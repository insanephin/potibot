map $request_uri $sse_client {
    ~^/api/spotify/playback(\?|$) $binary_remote_addr;
    default "";
}
limit_conn_zone $sse_client zone=sse_per_ip:10m;

server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s;

    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    add_header_inherit merge;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /srv/frontend/dist;

    location /api/ {
        set $api_upstream backend-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_buffering off;

        limit_conn sse_per_ip 20;
        limit_conn_status 429;

        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"service_unavailable"}';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ @spa;
        add_header Cache-Control "no-cache";
    }

    location @spa {
        try_files /index.html =503;
        add_header Cache-Control "no-cache";
    }
}
