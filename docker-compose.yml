services:
  nginx:
    build: ./frontend
    image: potibot-web
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8089:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - local
    depends_on:
      - api

  api:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-api.txt
    image: chzzk-bot-api
    container_name: backend-api
    restart: unless-stopped
    volumes:
      - ./backend:/app
    working_dir: /app
    networks:
      - dbs
      - local
    command: python app.py

  worker:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-worker.txt
    image: chzzk-bot-worker
    container_name: backend-worker
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./backend:/app
    working_dir: /app
    networks:
      - dbs
      - local
    command: python worker.py

networks:
  local:
    driver: bridge
  dbs:
    external: true