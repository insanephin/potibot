services:
  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "8089:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/srv/frontend:ro
    networks:
      - local
    depends_on:
      - api
      - frontend

  api:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-api.txt
    image: chzzk-bot-api
    container_name: backend-api
    restart: unless-stopped
    volumes:
      - ./backend:/app
    working_dir: /app
    networks:
      - dbs
      - local
    command: python app.py

  worker:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-worker.txt
    image: chzzk-bot-worker
    container_name: backend-worker
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./backend:/app
    working_dir: /app
    networks:
      - dbs
      - local
    command: python worker.py

  frontend:
    container_name: frontend
    image: node:22-alpine
    depends_on:
      - api
    working_dir: /app
    volumes:
      - ./frontend:/app
    networks:
      - local
    command: sh -c "npm ci && npm run build"

networks:
  local:
    driver: bridge
  dbs:
    external: true